name: bazarpro
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+11

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.4

  # Functional Programming
  dartz: ^0.10.1

  # UI
  data_table_2: ^2.7.2
  context_menus: ^1.0.2

  # Utilities
  intl: ^0.18.1
  dio: ^5.9.0
  google_fonts: ^6.3.3
  flutter_svg: ^2.2.3
  flutter_screenutil: ^5.9.3
  fl_chart: ^1.1.1
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/gifs/
    - assets/images/
    - assets/icons/auth/
    - assets/icons/market/
    - assets/icons/menu/
    - assets/icons/common/
    - assets/icons/view/
    - assets/icons/users/
    - assets/images/bazaar_logo.png

flutter_launcher_icons:
  android: false
  ios: false

  # Windows Configuration
  windows:
    generate: true
    image_path: "assets/images/bazaar_logo.png"
    icon_size: 48

  # macOS Configuration
  macos:
    generate: true
    image_path: "assets/images/bazaar_logo.png"
